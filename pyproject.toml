[project]
name = "msp-mcp"
version = "0.6.1"
description = "MCP servers for the MSP stack: Datto RMM, ThreatLocker, Mimecast, Asset Panda, Portnox, CrowdStrike Falcon launcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
]

[project.scripts]
msp-mcp-datto = "msp_mcp.datto.server:main"
msp-mcp-assetpanda = "msp_mcp.assetpanda.server:main"
msp-mcp-threatlocker = "msp_mcp.threatlocker.server:main"
msp-mcp-mimecast = "msp_mcp.mimecast.server:main"
msp-mcp-portnox = "msp_mcp.portnox.server:main"
msp-mcp-crowdstrike = "msp_mcp.crowdstrike.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msp_mcp"]
